<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940">
  <defs>
    <style>
      .bg { fill: #f4f7fb; }
      .card { fill: #ffffff; stroke: #dbe5ef; stroke-width: 1.5; }
      .title { font: 800 34px Inter, Arial, sans-serif; fill: #102033; }
      .subtitle { font: 500 18px Inter, Arial, sans-serif; fill: #53657a; }
      .label { font: 800 22px Inter, Arial, sans-serif; fill: #102033; }
      .desc { font: 500 15px Inter, Arial, sans-serif; fill: #65758a; }
      .mini-label { font: 700 12px Inter, Arial, sans-serif; fill: #65758a; letter-spacing: .05em; }
      .blue { fill: #1e6fd9; }
      .green { fill: #2aa57c; }
      .cyan { fill: #39b6d8; }
      .ink { fill: #102033; }
      .white { fill: #ffffff; }
      .line-white { fill: none; stroke: #ffffff; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .line-green { fill: none; stroke: #2aa57c; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .line-blue { fill: none; stroke: #1e6fd9; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .s-heavy { font: 900 86px Inter, Arial, sans-serif; fill: #ffffff; }
      .s-mini { font: 900 22px Inter, Arial, sans-serif; fill: #ffffff; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#123" flood-opacity=".10"/>
    </filter>

    <g id="opt-monogram">
      <rect x="0" y="0" width="120" height="120" rx="28" class="blue"/>
      <text x="33" y="86" class="s-heavy">S</text>
      <circle cx="94" cy="94" r="13" class="green"/>
    </g>
    <g id="opt-orbital">
      <circle cx="60" cy="60" r="56" class="blue"/>
      <path d="M78 28H48c-13 0-22 7-22 17 0 11 8 16 21 18l16 3c8 2 12 5 12 10 0 6-6 10-15 10H29" class="line-white"/>
      <circle cx="99" cy="34" r="10" class="green"/>
      <path d="M20 87c25 18 55 20 86 1" fill="none" stroke="#39b6d8" stroke-width="5" stroke-linecap="round" opacity=".9"/>
    </g>
    <g id="opt-nodes">
      <rect x="0" y="0" width="120" height="120" rx="28" fill="#102033"/>
      <path d="M84 25C49 25 35 39 59 55c28 19 9 40-24 40" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
      <circle cx="84" cy="25" r="11" class="cyan"/>
      <circle cx="60" cy="57" r="11" class="green"/>
      <circle cx="35" cy="95" r="11" class="blue"/>
    </g>
    <g id="opt-pulse">
      <rect x="0" y="0" width="120" height="120" rx="28" class="blue"/>
      <path d="M82 28H48c-13 0-21 7-21 17 0 9 6 14 18 17l21 5c8 2 12 5 12 10 0 7-6 11-16 11H34" class="line-white"/>
      <path d="M21 63h18l7-15 11 30 9-21h33" fill="none" stroke="#2aa57c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="opt-shield">
      <path d="M60 6l44 15v34c0 28-18 48-44 59-26-11-44-31-44-59V21z" class="blue"/>
      <path d="M78 32H50c-12 0-20 7-20 16 0 10 7 14 20 17l14 3c8 2 12 5 12 10 0 6-6 9-15 9H33" class="line-white"/>
      <circle cx="87" cy="88" r="10" class="green"/>
    </g>
    <g id="opt-spark">
      <rect x="0" y="0" width="120" height="120" rx="28" fill="#0f766e"/>
      <text x="33" y="86" class="s-heavy">S</text>
      <path d="M92 20l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#9ff2df"/>
    </g>
  </defs>

  <rect width="1400" height="940" class="bg"/>
  <text x="70" y="72" class="title">Opciones de favicon / isotipo para Systia.ar</text>
  <text x="70" y="106" class="subtitle">Comparativa para solapa de navegador: alto contraste, forma memorable y lectura a 16-32 px.</text>

  <g transform="translate(70 150)">
    <g filter="url(#shadow)">
      <rect class="card" width="390" height="220" rx="22"/>
      <use href="#opt-monogram" x="28" y="32"/>
      <text x="170" y="58" class="label">1. Monograma S Punto</text>
      <text x="170" y="88" class="desc">Directo, legible y recordable.</text>
      <text x="170" y="112" class="desc">La S identifica marca; el punto verde</text>
      <text x="170" y="136" class="desc">queda como rasgo propio.</text>
      <text x="28" y="186" class="mini-label">16 PX</text>
      <use href="#opt-monogram" x="76" y="168" transform="scale(.2667)"/>
      <text x="128" y="186" class="mini-label">32 PX</text>
      <use href="#opt-monogram" x="178" y="156" transform="scale(.2667)"/>
    </g>
  </g>

  <g transform="translate(505 150)">
    <g filter="url(#shadow)">
      <rect class="card" width="390" height="220" rx="22"/>
      <use href="#opt-orbital" x="28" y="32"/>
      <text x="170" y="58" class="label">2. S Orbital</text>
      <text x="170" y="88" class="desc">Más tecnológica y de suite.</text>
      <text x="170" y="112" class="desc">El punto satélite da identidad</text>
      <text x="170" y="136" class="desc">sin depender de texto pequeño.</text>
      <text x="28" y="186" class="mini-label">16 PX</text>
      <use href="#opt-orbital" x="76" y="168" transform="scale(.2667)"/>
      <text x="128" y="186" class="mini-label">32 PX</text>
      <use href="#opt-orbital" x="178" y="156" transform="scale(.2667)"/>
    </g>
  </g>

  <g transform="translate(940 150)">
    <g filter="url(#shadow)">
      <rect class="card" width="390" height="220" rx="22"/>
      <use href="#opt-nodes" x="28" y="32"/>
      <text x="170" y="58" class="label">3. Nodo Systia</text>
      <text x="170" y="88" class="desc">Tres módulos conectados.</text>
      <text x="170" y="112" class="desc">Comunica red, agentes, datos</text>
      <text x="170" y="136" class="desc">e interoperabilidad clínica.</text>
      <text x="28" y="186" class="mini-label">16 PX</text>
      <use href="#opt-nodes" x="76" y="168" transform="scale(.2667)"/>
      <text x="128" y="186" class="mini-label">32 PX</text>
      <use href="#opt-nodes" x="178" y="156" transform="scale(.2667)"/>
    </g>
  </g>

  <g transform="translate(70 420)">
    <g filter="url(#shadow)">
      <rect class="card" width="390" height="220" rx="22"/>
      <use href="#opt-pulse" x="28" y="32"/>
      <text x="170" y="58" class="label">4. Systia Pulse</text>
      <text x="170" y="88" class="desc">Más clínico y activo.</text>
      <text x="170" y="112" class="desc">Funciona para salud, aunque el</text>
      <text x="170" y="136" class="desc">pulso puede perderse a 16 px.</text>
      <text x="28" y="186" class="mini-label">16 PX</text>
      <use href="#opt-pulse" x="76" y="168" transform="scale(.2667)"/>
      <text x="128" y="186" class="mini-label">32 PX</text>
      <use href="#opt-pulse" x="178" y="156" transform="scale(.2667)"/>
    </g>
  </g>

  <g transform="translate(505 420)">
    <g filter="url(#shadow)">
      <rect class="card" width="390" height="220" rx="22"/>
      <use href="#opt-shield" x="28" y="32"/>
      <text x="170" y="58" class="label">5. Escudo Clínico</text>
      <text x="170" y="88" class="desc">Transmite seguridad y custodia.</text>
      <text x="170" y="112" class="desc">Adecuado para datos sensibles,</text>
      <text x="170" y="136" class="desc">más institucional que moderno.</text>
      <text x="28" y="186" class="mini-label">16 PX</text>
      <use href="#opt-shield" x="76" y="168" transform="scale(.2667)"/>
      <text x="128" y="186" class="mini-label">32 PX</text>
      <use href="#opt-shield" x="178" y="156" transform="scale(.2667)"/>
    </g>
  </g>

  <g transform="translate(940 420)">
    <g filter="url(#shadow)">
      <rect class="card" width="390" height="220" rx="22"/>
      <use href="#opt-spark" x="28" y="32"/>
      <text x="170" y="58" class="label">6. Systia Spark</text>
      <text x="170" y="88" class="desc">Asistencia inteligente e IA.</text>
      <text x="170" y="112" class="desc">Tiene personalidad, pero puede</text>
      <text x="170" y="136" class="desc">verse menos clínico.</text>
      <text x="28" y="186" class="mini-label">16 PX</text>
      <use href="#opt-spark" x="76" y="168" transform="scale(.2667)"/>
      <text x="128" y="186" class="mini-label">32 PX</text>
      <use href="#opt-spark" x="178" y="156" transform="scale(.2667)"/>
    </g>
  </g>

  <g transform="translate(70 735)">
    <rect width="1260" height="120" rx="24" fill="#e8f3ef" stroke="#c8e4d7"/>
    <text x="30" y="42" class="label">Recomendación de diseño</text>
    <text x="30" y="74" class="subtitle">Para una marca tipo Google/Amazon/Claude/ChatGPT, las opciones más fuertes son 1, 2 y 3.</text>
    <text x="30" y="100" class="subtitle">La 2 “S Orbital” es la mejor si querés una identidad más tecnológica y de suite; la 1 es la más legible a tamaño mínimo.</text>
  </g>
</svg>
