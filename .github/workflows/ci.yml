name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hce_admin
          POSTGRES_PASSWORD: hce_test
          POSTGRES_DB: hce_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: hce-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: hce-backend/package-lock.json
      - run: npm ci
      # Sin --fix: en CI, `eslint --fix` corrige en un árbol que después se
      # descarta, así que enmascara la deuda auto-corregible en vez de mostrarla.
      # --max-warnings congela el baseline: los warnings heredados no rompen,
      # pero uno nuevo sí. Es el trinquete que impide que la deuda crezca.
      # Baseline al 2026-08-17: 0 errores, ~1.508 warnings. El techo lleva una
      # holgura minima porque el conteo se midio en Windows; se ajusta al valor
      # exacto del runner tras la primera corrida verde.
      - run: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings 1520

  test-backend:
    runs-on: ubuntu-latest
    # NO declara `needs: lint` a propósito. Cuando lo hacía, un lint en rojo
    # dejaba los tests en `skipped`: entre el 2026-06-18 y el 2026-08-17 los
    # 172 tests del backend no se ejecutaron ni una sola vez en GitHub, y nadie
    # lo noto porque el PR mostraba "checks failed" sin distinguir por que.
    # Los tests son la red de seguridad: nunca deben depender del estilo.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hce_admin
          POSTGRES_PASSWORD: hce_test
          POSTGRES_DB: hce_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: hce-backend
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: hce_admin
      DB_PASSWORD: hce_test
      DB_NAME: hce_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: hce-backend/package-lock.json
      - run: npm ci
      - run: npm run build
      # Sin --passWithNoTests: si la config de jest se rompe o alguien borra los
      # specs, el job debe fallar, no pasar en verde con cero pruebas.
      - run: npm test

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hce-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: hce-frontend/package-lock.json
      - run: npm ci
      # Techo exacto del baseline al 2026-08-17: 328 warnings, 0 errores.
      # Ajustado al valor real, no redondeado: un trinquete con holgura no
      # impide que la deuda crezca dentro de esa holgura.
      - run: npx eslint . --max-warnings 328
      - run: npm run build
